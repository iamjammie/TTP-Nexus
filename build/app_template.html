<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTP NEXUS</title>
<style>
:root{
  --bg:#0b0f14; --bg2:#0e141b; --panel:#101a26; --panel2:#0c1521; --panel3:#13202f;
  --border:#1d2d3f; --border2:#28415a; --text:#d8e3ef; --text-dim:#8aa0b6; --text-faint:#5f758c;
  --cyan:#35d0d8; --blue:#3b82f6; --blue2:#60a5fa; --amber:#f0a12e; --red:#ef4a5a; --green:#2fbf71; --purple:#a06bd8;
  --off:#ef4a5a; --def:#2fbf71; --radius:10px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;
  background-image:linear-gradient(rgba(53,208,216,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(53,208,216,.025) 1px,transparent 1px);
  background-size:34px 34px;}
a{color:var(--blue2);text-decoration:none}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* layout */
#app{display:flex;min-height:100vh}
#sidebar{width:236px;flex-shrink:0;background:linear-gradient(180deg,var(--panel),var(--panel2));
  border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;transition:width .18s;z-index:30}
#sidebar.collapsed{width:60px}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--border)}
.brand .logo{width:30px;height:30px;flex-shrink:0;border-radius:7px;background:linear-gradient(135deg,var(--cyan),var(--blue));
  display:grid;place-items:center;font-weight:800;color:#04121a;font-size:15px}
.brand .bt{font-weight:700;letter-spacing:.3px;font-size:15px;white-space:nowrap}
.brand .bt small{display:block;color:var(--text-faint);font-weight:500;font-size:10px;letter-spacing:1.5px;text-transform:uppercase}
#sidebar.collapsed .bt,#sidebar.collapsed .nav-label,#sidebar.collapsed .nav-sec{display:none}
nav{padding:8px 8px 20px}
.nav-sec{padding:14px 10px 6px;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-faint)}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:var(--text-dim);
  cursor:pointer;margin:1px 0;white-space:nowrap;border:1px solid transparent;font-size:13px}
.nav-item:hover{background:var(--panel3);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(53,208,216,.14),rgba(59,130,246,.05));color:#fff;border-color:var(--border2)}
.nav-item .ic{width:18px;text-align:center;flex-shrink:0;font-size:14px}
.nav-item.active .ic{color:var(--cyan)}

#content{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);
  background:rgba(11,15,20,.75);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
#burger{background:var(--panel3);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:8px;font-size:15px}
.topsearch{flex:1;max-width:620px;position:relative}
.topsearch input{width:100%;background:var(--panel2);border:1px solid var(--border2);color:var(--text);
  padding:9px 14px 9px 36px;border-radius:9px;font-size:13px;outline:none}
.topsearch input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(53,208,216,.12)}
.topsearch .si{position:absolute;left:12px;top:9px;color:var(--text-faint)}
.topsearch .sx{position:absolute;right:10px;top:7px;color:var(--text-faint);background:none;border:none;font-size:16px;display:none}
.sugg{position:absolute;top:44px;left:0;right:0;background:var(--panel);border:1px solid var(--border2);border-radius:10px;
  overflow:hidden;z-index:60;max-height:420px;overflow-y:auto;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.sugg .sg-item{padding:9px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.sugg .sg-item:hover{background:var(--panel3)}
.tag{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:700;letter-spacing:.4px;white-space:nowrap}
.tag.attack{background:rgba(239,74,90,.16);color:#ff8a94}
.tag.ics{background:rgba(240,161,46,.16);color:#f6c173}
.tag.mobile{background:rgba(160,107,216,.16);color:#c9a6ea}
.tag.d3fend{background:rgba(47,191,113,.16);color:#7ee0a6}
.tag.capec{background:rgba(59,130,246,.16);color:#8fb8f6}
.tag.cwe{background:rgba(53,208,216,.14);color:#7fe4ea}
.tag.cve{background:rgba(239,74,90,.12);color:#f29aa2}
.tag.killchain{background:rgba(160,107,216,.14);color:#c9a6ea}
.tag.ptes,.tag.wstg,.tag.owasp,.tag.nist{background:rgba(138,160,182,.14);color:#aebfd0}
.tag.mit{background:rgba(47,191,113,.12);color:#7ee0a6}

#main{padding:22px 24px 60px;max-width:1500px;width:100%}
.view-title{font-size:21px;font-weight:700;margin:0 0 3px}
.view-sub{color:var(--text-dim);margin:0 0 20px;font-size:13px}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.panel+.panel{margin-top:16px}
.grid{display:grid;gap:14px}
.muted{color:var(--text-dim)}.faint{color:var(--text-faint)}
.mono{font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel3);border:1px solid var(--border2);
  color:var(--text-dim);padding:3px 9px;border-radius:20px;font-size:11px;margin:2px 3px 2px 0}
.chip.on{background:rgba(53,208,216,.16);border-color:var(--cyan);color:#bff0f3}
.btn{background:var(--panel3);border:1px solid var(--border2);color:var(--text);padding:8px 13px;border-radius:8px;font-size:12.5px;font-weight:600}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04121a;border:none}
.btn.sm{padding:5px 9px;font-size:11.5px}
.btn.danger{border-color:rgba(239,74,90,.5);color:#ff9aa3}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
input,select,textarea{font-family:inherit}
.field{background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:8px 11px;border-radius:8px;font-size:13px;outline:none}
.field:focus{border-color:var(--cyan)}
label.lbl{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-faint);display:block;margin-bottom:5px}

/* stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan)}
.stat.off::before{background:var(--off)}.stat.def::before{background:var(--def)}.stat.b::before{background:var(--blue)}
.stat .n{font-size:26px;font-weight:800;font-family:var(--mono);line-height:1}
.stat .l{color:var(--text-dim);font-size:11.5px;margin-top:5px;text-transform:uppercase;letter-spacing:.5px}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fcard{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:15px;cursor:pointer;transition:.14s}
.fcard:hover{border-color:var(--border2);transform:translateY(-2px)}
.fcard h4{margin:0 0 4px;font-size:14px}
.fcard p{margin:0;color:var(--text-dim);font-size:12px}
.fcard .cnt{font-size:11px;color:var(--cyan);font-family:var(--mono);margin-top:9px}

/* list + detail layout */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
@media(max-width:1050px){.split{grid-template-columns:1fr}}
.list{max-height:calc(100vh - 230px);overflow-y:auto}
.li{padding:11px 13px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px;cursor:pointer;background:var(--panel2)}
.li:hover{border-color:var(--border2)}
.li.sel{border-color:var(--cyan);background:rgba(53,208,216,.07)}
.li .id{font-family:var(--mono);font-size:12px;color:var(--cyan)}
.li .nm{font-weight:600;font-size:13.5px;margin:2px 0}
.li .ds{color:var(--text-dim);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li.off .id{color:#ff8a94}.li.def .id{color:#7ee0a6}

.detail{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow-y:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:14px 0 14px;flex-wrap:wrap}
.tab{padding:7px 12px;color:var(--text-dim);border-bottom:2px solid transparent;font-size:12.5px;font-weight:600;cursor:pointer}
.tab.active{color:#fff;border-color:var(--cyan)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:13px;margin:4px 0}
.kv .k{color:var(--text-faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding-top:1px}
.rel{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:7px;font-size:11.5px;margin:3px 4px 3px 0;
  background:var(--panel3);border:1px solid var(--border2);cursor:pointer;font-family:var(--mono)}
.rel:hover{border-color:var(--cyan)}
.srcflag{font-size:9.5px;padding:1px 5px;border-radius:4px;background:var(--panel);border:1px solid var(--border2);color:var(--text-faint);
  text-transform:uppercase;letter-spacing:.4px;margin-left:5px}
.srcflag.auth{color:#7ee0a6;border-color:rgba(47,191,113,.4)}
.srcflag.analyst{color:#f6c173;border-color:rgba(240,161,46,.4)}
.sectitle{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-faint);margin:16px 0 7px;border-bottom:1px solid var(--border);padding-bottom:5px}
ul.clean{margin:6px 0;padding-left:18px}ul.clean li{margin:3px 0;font-size:13px}

/* kill chain strip */
.kc-strip{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px}
.kc-stage{min-width:135px;flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;
  cursor:pointer;position:relative;transition:.14s}
.kc-stage:hover{border-color:var(--cyan);transform:translateY(-2px)}
.kc-stage .num{font-family:var(--mono);font-size:11px;color:var(--text-faint)}
.kc-stage .kn{font-weight:700;font-size:13px;margin:4px 0}
.kc-stage .arrow{position:absolute;right:-11px;top:50%;transform:translateY(-50%);color:var(--border2);z-index:2;font-size:14px}
.kc-stage.on{border-color:var(--cyan);background:rgba(53,208,216,.08)}

/* matrix */
.matrix-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:calc(100vh - 250px)}
.matrix{display:flex;gap:0;min-width:max-content}
.mcol{min-width:148px;border-right:1px solid var(--border);display:flex;flex-direction:column}
.mcol .mh{padding:8px 9px;background:var(--panel);border-bottom:1px solid var(--border2);position:sticky;top:0;z-index:2}
.mcol .mh .tn{font-size:11.5px;font-weight:700}.mcol .mh .tc{font-size:10px;color:var(--text-faint);font-family:var(--mono)}
.cell{padding:6px 9px;border-bottom:1px solid var(--border);font-size:11.5px;cursor:pointer;line-height:1.3}
.cell:hover{background:var(--panel3)}
.cell .cid{font-family:var(--mono);font-size:10px;color:var(--text-faint)}
.cell.scored{box-shadow:inset 3px 0 0 var(--score,var(--cyan))}

/* graph */
.graph-wrap{border:1px solid var(--border);border-radius:10px;background:radial-gradient(circle at 50% 40%,#0d1826,#0a0f16);overflow:hidden;position:relative}
.graph-wrap svg{display:block;width:100%;cursor:grab}
.graph-wrap svg:active{cursor:grabbing}
.glegend{position:absolute;bottom:10px;left:10px;background:rgba(10,15,22,.85);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;font-size:11px}
.glegend span{display:inline-flex;align-items:center;gap:5px;margin-right:12px}
.gdot{width:9px;height:9px;border-radius:50%;display:inline-block}

/* flashcard */
.flash{perspective:1400px;max-width:460px;margin:0 auto}
.flash-inner{position:relative;height:280px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash.flip .flash-inner{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--border2);border-radius:14px;
  padding:24px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(145deg,var(--panel),var(--panel2))}
.flash-back{transform:rotateY(180deg);background:linear-gradient(145deg,#0c1a14,#0a1510);border-color:rgba(47,191,113,.3)}

/* quiz */
.qopt{padding:11px 14px;border:1px solid var(--border2);border-radius:9px;margin:7px 0;cursor:pointer;background:var(--panel2)}
.qopt:hover{border-color:var(--cyan)}
.qopt.correct{border-color:var(--green);background:rgba(47,191,113,.12)}
.qopt.wrong{border-color:var(--red);background:rgba(239,74,90,.12)}

/* toast + modal */
#toast{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px}
.tmsg{background:var(--panel);border:1px solid var(--border2);border-left:3px solid var(--cyan);padding:11px 16px;border-radius:8px;
  font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:slidein .25s}
@keyframes slidein{from{transform:translateX(40px);opacity:0}}
.modal-bg{position:fixed;inset:0;background:rgba(4,8,12,.72);z-index:150;display:grid;place-items:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:14px;max-width:640px;width:100%;max-height:86vh;overflow-y:auto;padding:22px}
.modal h3{margin:0 0 14px}
.close-x{float:right;background:none;border:none;color:var(--text-dim);font-size:22px;line-height:1}

.badge-off{color:var(--off)}.badge-def{color:var(--def)}
.sev-Critical{color:#ff6b78;font-weight:700}.sev-High{color:#f0a12e;font-weight:700}.sev-Medium{color:#f0d02e}.sev-Low{color:#7ee0a6}
.notice{background:rgba(240,161,46,.08);border:1px solid rgba(240,161,46,.3);border-radius:8px;padding:10px 13px;font-size:12px;color:#f6c173}
.pill-count{background:var(--panel3);border:1px solid var(--border2);border-radius:20px;padding:1px 8px;font-size:11px;font-family:var(--mono);color:var(--text-dim)}
hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0}
.checkitem{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:13px}
.checkitem input{margin-top:3px}
mark{background:rgba(240,161,46,.35);color:#fff;border-radius:3px;padding:0 2px}
/* confidence badges */
.conf{font-size:9.5px;padding:1px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.4px;margin-left:6px;border:1px solid;font-weight:700;white-space:nowrap}
.conf.official{color:#7ee0a6;border-color:rgba(47,191,113,.5);background:rgba(47,191,113,.08)}
.conf.validated{color:#8fb8f6;border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.08)}
.conf.curated{color:#f6c173;border-color:rgba(240,161,46,.5);background:rgba(240,161,46,.08)}
.conf.inferred{color:#c9a6ea;border-color:rgba(160,107,216,.5);background:rgba(160,107,216,.08)}
/* breadcrumb */
#crumb{display:flex;align-items:center;gap:7px;padding:8px 24px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-dim);background:rgba(11,15,20,.4)}
#crumb a{cursor:pointer;color:var(--text-dim)}#crumb a:hover{color:var(--cyan)}
#crumb .sepc{color:var(--text-faint)}#crumb b{color:var(--text)}
/* command palette */
.cmdk-bg{position:fixed;inset:0;background:rgba(4,8,12,.6);z-index:160;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.cmdk{background:var(--panel);border:1px solid var(--border2);border-radius:14px;width:min(640px,92vw);box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden}
.cmdk input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);padding:16px 18px;font-size:15px;outline:none}
.cmdk-list{max-height:52vh;overflow-y:auto}
.cmdk-item{padding:10px 18px;display:flex;align-items:center;gap:10px;cursor:pointer;border-bottom:1px solid var(--border)}
.cmdk-item.on,.cmdk-item:hover{background:var(--panel3)}
.cmdk-foot{padding:8px 18px;font-size:11px;color:var(--text-faint);display:flex;gap:14px;border-top:1px solid var(--border)}
kbd{background:var(--panel3);border:1px solid var(--border2);border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:11px}
/* courses */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.course-card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:.14s;position:relative}
.course-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.course-card .lvl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:2px 8px;border-radius:5px;background:var(--panel3);border:1px solid var(--border2);color:var(--text-dim)}
.progbar{height:6px;border-radius:4px;background:var(--panel3);overflow:hidden;margin-top:10px}
.progbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue))}
.lesson{border:1px solid var(--border);border-radius:9px;padding:14px;margin:10px 0;background:var(--panel2)}
.lesson.done{border-color:rgba(47,191,113,.4)}
.lesson h4{margin:0 0 4px}
/* coverage bars */
.cov-row{display:grid;grid-template-columns:200px 1fr 54px;gap:12px;align-items:center;margin:7px 0;font-size:12.5px}
.cov-bar{height:16px;border-radius:5px;background:var(--panel3);overflow:hidden;border:1px solid var(--border)}
.cov-bar>i{display:block;height:100%}
.cov-bar>i.g{background:var(--green)}.cov-bar>i.a{background:var(--amber)}.cov-bar>i.r{background:var(--red)}.cov-bar>i.b{background:var(--blue)}
.detgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.telbox{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:12px}
.telbox .th{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
pre.sigma{background:#0a0f16;border:1px solid var(--border);border-radius:8px;padding:11px;font-family:var(--mono);font-size:11.5px;overflow-x:auto;color:#bcd;white-space:pre}
.integrity-ok{color:var(--green)}.integrity-warn{color:var(--amber)}
.netdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;margin-right:2px;box-shadow:0 0 0 3px transparent}
.netdot.chk{background:var(--text-faint);animation:pulse 1.1s infinite}
.netdot.on{background:var(--green);box-shadow:0 0 6px rgba(47,191,113,.7)}
.netdot.off{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.upd-src{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 11px;border:1px solid var(--border);border-radius:8px;margin:6px 0;background:var(--panel2)}
#updMsg{min-height:18px;font-size:12.5px;margin:8px 0}
.drop{border:1.5px dashed var(--border2);border-radius:10px;padding:18px;text-align:center;color:var(--text-dim);cursor:pointer}
.drop:hover{border-color:var(--cyan)}
/* light theme */
html[data-theme="light"]{--bg:#eef2f6;--bg2:#e6ecf2;--panel:#ffffff;--panel2:#f6f9fc;--panel3:#eef3f8;--border:#d2dce6;--border2:#b4c4d4;
  --text:#16222e;--text-dim:#44586b;--text-faint:#75899c;--cyan:#0b8f98;--blue:#2563eb;--blue2:#1d4ed8;}
html[data-theme="light"] body{background-image:linear-gradient(rgba(11,143,152,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(11,143,152,.04) 1px,transparent 1px)}
html[data-theme="light"] pre.sigma{background:#f3f6f9;color:#243}
@media print{#sidebar,#topbar,#burger,#crumb,.noprint{display:none!important}#main{padding:0}body{background:#fff;color:#000}}
@media(max-width:720px){#sidebar{position:fixed;left:0;box-shadow:0 0 40px rgba(0,0,0,.6)}#sidebar.collapsed{width:0;border:none}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">

const uniq=a=>[...new Set(a)];
function toast(m){const t=document.createElement('div');t.className='tmsg';t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>t.remove(),2600);}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem('ttp_'+k)||'null');localStorage.setItem('ttp_'+k,JSON.stringify(v));}catch(e){return null;}}

/* ---- indices + correlation engine ---- */
const IDX={byId:{},search:[]};
const tacticName=id=>{for(const t of KB.attack.tactics)if(t.id===id)return t.name;for(const t of KB.ics.tactics)if(t.id===id)return t.name;for(const t of KB.mobile.tactics)if(t.id===id)return t.name;return id;};
function register(type,fw,id,name,text){IDX.byId[id]={type,fw,id,name};IDX.search.push({type,fw,id,name,text:(name+' '+id+' '+(text||'')).toLowerCase()});}
function buildIndex(){
  IDX.byId={};IDX.search=[];

    (t.subs||[]).forEach(s=>register('subtechnique','attack',s.id,s.name,s.summary+' parent '+t.id));});
  KB.ics.techniques.forEach(t=>register('technique','ics',t.id,t.name,t.summary));
  KB.mobile.techniques.forEach(t=>register('technique','mobile',t.id,t.name,t.summary));
  KB.d3fend.techniques.forEach(d=>register('countermeasure','d3fend',d.id,d.name,d.definition));
  KB.capec.forEach(c=>register('pattern','capec',c.id,c.name,c.summary));
  KB.cwe.forEach(c=>register('weakness','cwe',c.id,c.name,c.summary));
  KB.cve.forEach(c=>register('vulnerability','cve',c.id,c.desc,c.products.join(' ')));
  KB.killchain.forEach(k=>register('killchain','killchain',k.id,k.name,k.summary));
  KB.ptes.forEach(p=>register('phase','ptes',p.id,p.name,p.summary));
  KB.wstg.forEach(w=>register('wstg','wstg',w.id,w.name,w.summary+' '+w.tests.join(' ')));

}
// reverse maps

function buildRev(){
  Object.keys(REV).forEach(k=>REV[k]={});
  KB.capec.forEach(c=>{REV.capecById[c.id]=c;(c.attack||[]).forEach(a=>{(REV.attack2capec[a]=REV.attack2capec[a]||[]).push(c.id);});(c.cwe||[]).forEach(w=>{(REV.cwe2capec[w]=REV.cwe2capec[w]||[]).push(c.id);});});
  KB.cwe.forEach(w=>{REV.cweById[w.id]=w;(w.attack||[]).forEach(a=>{(REV.attack2cwe[a]=REV.attack2cwe[a]||[]).push(w.id);});});
  KB.cve.forEach(v=>{(v.cwe||[]).forEach(w=>{(REV.cwe2cve[w]=REV.cwe2cve[w]||[]).push(v.id);});});
  KB.d3fend.techniques.forEach(d=>{REV.d3ById[d.id]=d;(d.counters||[]).forEach(a=>{(REV.attack2d3[a]=REV.attack2d3[a]||[]).push(d.id);});});
  KB.attack.techniques.forEach(t=>{REV.techById[t.id]=t;(t.subs||[]).forEach(s=>{REV.subById[s.id]=s;REV.subParent[s.id]=t.id;});});
  KB.killchain.forEach(k=>{REV.killById[k.id]=k;});
}

/* ============================ UNIVERSAL SEARCH ============================ */
function runSearch(q){q=q.trim();if(!q)return[];const ql=q.toLowerCase();
  // boolean AND terms
  const terms=ql.split(/\s+/).filter(Boolean);
  let res=IDX.search.map(o=>{let score=0;
    if(o.id.toLowerCase()===ql)score+=100;
    if(o.id.toLowerCase().startsWith(ql))score+=40;
    if(o.name.toLowerCase().includes(ql))score+=20;
    let all=terms.every(t=>o.text.includes(t));if(all)score+=10;
    terms.forEach(t=>{if(o.text.includes(t))score+=2;});
    // fuzzy: id without punctuation
    if(o.id.toLowerCase().replace(/[-.]/g,'').includes(ql.replace(/[-.]/g,'')))score+=15;
    return{o,score};}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  return res.slice(0,40).map(x=>x.o);}
function highlight(txt,q){if(!q)return esc(txt);const terms=q.toLowerCase().split(/\s+/).filter(t=>t.length>1);let out=esc(txt);
  terms.forEach(t=>{const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');out=out.replace(re,'<mark>$1</mark>');});return out;}
function addHistory(q){let h=store('history')||[];h=[q,...h.filter(x=>x!==q)].slice(0,12);store('history',h);}
function wireSearch(){

      <span class="mono" style="color:var(--cyan);font-size:12px">${esc(o.id)}</span><span>${highlight(o.name,q)}</span></div>`).join('');
    sg.style.display='block';});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const q=inp.value.trim();if(q){addHistory(q);const r=runSearch(q);if(r.length===1){pickSearch(r[0].id);}else{go('searchresults',encodeURIComponent(q));}sg.style.display='none';}}});
  sx.onclick=()=>{inp.value='';sx.style.display='none';sg.style.display='none';};
  document.addEventListener('click',e=>{if(!e.target.closest('.topsearch'))sg.style.display='none';});
}

function buildMapGraph(c){
  const nodes=[],links=[];const add=(id,label,type)=>{if(!nodes.find(n=>n.id===id)){nodes.push({id,label,type});}};

/* generic force graph */
function drawGraph(containerId,svgId,nodes,linkPairs){
  const W=900,H=460;const byId={};nodes.forEach(n=>byId[n.id]=n);
  const links=linkPairs.map(([a,b])=>({s:byId[a],t:byId[b]})).filter(l=>l.s&&l.t);
  nodes.forEach((n,i)=>{n.x=W/2+Math.cos(i/nodes.length*6.28)*160*Math.random()+ (Math.random()*60-30);n.y=H/2+Math.sin(i/nodes.length*6.28)*140*Math.random();n.vx=0;n.vy=0;});
  for(let it=0;it<320;it++){
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      let dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d2=dx*dx+dy*dy+0.1,d=Math.sqrt(d2);
      let f=2600/d2,fx=f*dx/d,fy=f*dy/d;nodes[i].vx+=fx;nodes[i].vy+=fy;nodes[j].vx-=fx;nodes[j].vy-=fy;}
    links.forEach(l=>{let dx=l.t.x-l.s.x,dy=l.t.y-l.s.y,d=Math.sqrt(dx*dx+dy*dy)+0.1,f=(d-110)*0.025,fx=f*dx/d,fy=f*dy/d;l.s.vx+=fx;l.s.vy+=fy;l.t.vx-=fx;l.t.vy-=fy;});
    nodes.forEach(n=>{n.vx+=(W/2-n.x)*0.004;n.vy+=(H/2-n.y)*0.004;n.x+=Math.max(-12,Math.min(12,n.vx));n.y+=Math.max(-12,Math.min(12,n.vy));n.vx*=0.82;n.vy*=0.82;});
  }
  const col={attack:'#ef4a5a',capec:'#3b82f6',cwe:'#35d0d8',d3:'#2fbf71',cve:'#ff6b78',kc:'#a06bd8',tactic:'#8aa0b6'};
  const linksSvg=links.map(l=>`<line x1="${l.s.x.toFixed(1)}" y1="${l.s.y.toFixed(1)}" x2="${l.t.x.toFixed(1)}" y2="${l.t.y.toFixed(1)}" stroke="#28415a" stroke-width="1"/>`).join('');
  const nodesSvg=nodes.map(n=>`<g class="gnode" style="cursor:pointer" onclick="openId('${n.id}')"><circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${n.type==='attack'?11:8}" fill="${col[n.type]||'#888'}" stroke="#0a0f16" stroke-width="2"/>
     <text x="${n.x.toFixed(1)}" y="${(n.y-13).toFixed(1)}" fill="#cdd9e5" font-size="9" text-anchor="middle" font-family="monospace">${esc(n.label)}</text></g>`).join('');
  $('#'+containerId).innerHTML=`<svg id="${svgId}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${linksSvg}${nodesSvg}</svg>
    <div class="glegend"><span><i class="gdot" style="background:#ef4a5a"></i>Offensive</span><span><i class="gdot" style="background:#2fbf71"></i>Defensive</span><span><i class="gdot" style="background:#3b82f6"></i>Pattern</span><span><i class="gdot" style="background:#35d0d8"></i>Weakness</span></div>`;
  enableZoomPan(svgId,W,H);
}
function enableZoomPan(svgId,W,H){const svg=document.getElementById(svgId);if(!svg)return;let vb={x:0,y:0,w:W,h:H};let drag=null;
  const apply=()=>svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  svg.addEventListener('wheel',e=>{e.preventDefault();const s=e.deltaY>0?1.1:0.9;const mx=vb.x+vb.w*(e.offsetX/svg.clientWidth);const my=vb.y+vb.h*(e.offsetY/svg.clientHeight);
    vb.w=Math.min(W*3,Math.max(W*0.3,vb.w*s));vb.h=Math.min(H*3,Math.max(H*0.3,vb.h*s));vb.x=mx-vb.w*(e.offsetX/svg.clientWidth);vb.y=my-vb.h*(e.offsetY/svg.clientHeight);apply();},{passive:false});
  svg.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};});
  window.addEventListener('mousemove',e=>{if(!drag)return;vb.x=drag.vx-(e.clientX-drag.x)*vb.w/svg.clientWidth;vb.y=drag.vy-(e.clientY-drag.y)*vb.h/svg.clientHeight;apply();});
  window.addEventListener('mouseup',()=>drag=null);
}
function exportGraphSVG(svgId,name){const svg=document.getElementById(svgId);if(!svg){toast('No graph');return;}
  download(name+'.svg','<?xml version="1.0"?>\n'+svg.outerHTML,'image/svg+xml');toast('SVG exported');}

     <button class="btn sm" onclick="exportKGraphJSON()">⬇ JSON</button>
   </div></div>

let KG={nodes:[],links:[]};
function renderKGraph(){const focus=$('#gfocus').value;const depth=parseInt($('#gdepth').value);
  const nodes=[],links=[];const addN=(id,label,type)=>{if(!nodes.find(n=>n.id===id))nodes.push({id,label,type});};const addL=(a,b)=>links.push([a,b]);
  const t=REV.techById[focus];addN(focus,focus,'attack');
  const expand=(id)=>{const tt=REV.techById[id];if(!tt)return;
    (REV.attack2capec[id]||tt.capec||[]).forEach(x=>{addN(x,x,'capec');addL(id,x);});
    (REV.attack2cwe[id]||tt.cwe||[]).forEach(x=>{addN(x,x,'cwe');addL(id,x);});
    (REV.attack2d3[id]||[]).forEach(x=>{addN(x,x,'d3');addL(id,x);});
    (tt.killchain||[]).forEach(x=>{const k=REV.killById[x];addN(x,k.name,'kc');addL(id,x);});};
  expand(focus);
  if(depth===2){ // second hop: capec->cwe, cwe->cve
    [...nodes].forEach(n=>{if(n.type==='capec'){(REV.capecById[n.id].cwe||[]).forEach(w=>{addN(w,w,'cwe');addL(n.id,w);});}
      if(n.type==='cwe'){(REV.cwe2cve[n.id]||[]).forEach(v=>{addN(v,v,'cve');addL(n.id,v);});}});}
  KG={nodes,links};drawGraph('kgraph','kgSvg',nodes,links);
}
function exportKGraphJSON(){download('knowledge-graph.json',JSON.stringify({nodes:KG.nodes,edges:KG.links.map(([s,t])=>({source:s,target:t}))},null,2),'application/json');toast('Graph JSON exported');}

function genQuiz(){const techs=KB.attack.techniques;const pool=[];
  for(let i=0;i<8;i++){const t=techs[Math.floor(Math.random()*techs.length)];const type=Math.floor(Math.random()*3);
    if(type===0){const correct=tacticName(t.tactics[0]);const opts=uniq([correct,...shuffle(KB.attack.tactics).map(x=>x.name)]).slice(0,4);pool.push({q:`Which tactic does ${t.id} (${t.name}) primarily belong to?`,a:shuffle(opts),c:correct});}
    else if(type===1){const d3=(REV.attack2d3[t.id]||[]).map(x=>REV.d3ById[x].name);if(!d3.length){i--;continue;}const correct=d3[0];const opts=uniq([correct,...shuffle(KB.d3fend.techniques).map(x=>x.name)]).slice(0,4);pool.push({q:`Which D3FEND countermeasure helps counter ${t.id} (${t.name})?`,a:shuffle(opts),c:correct});}
    else{const correct=t.name;const opts=uniq([correct,...shuffle(techs).map(x=>x.name)]).slice(0,4);pool.push({q:`Which technique has the ID ${t.id}?`,a:shuffle(opts),c:correct});}}
  return{pool:pool.map(p=>({q:p.q,a:p.a,c:p.a.indexOf(p.c)})),i:0,score:0,src:'ATT&CK quiz'};}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function answerQuiz(i){const q=quizState.pool[quizState.i];const opts=$$('#qopts .qopt');opts.forEach((o,k)=>{o.style.pointerEvents='none';if(k===q.c)o.classList.add('correct');if(k===i&&i!==q.c)o.classList.add('wrong');});
  if(i===q.c)quizState.score++;setTimeout(()=>{quizState.i++;renderStudy();},850);}

function gatherRecords(scope,collection){
  let ids=[];
  if(scope==='collection'&&collection)ids=collection.items;
  else if(scope==='attack')return KB.attack.techniques.map(t=>recT(t));
  else{ // all
    return [].concat(KB.attack.techniques.map(recT),KB.capec.map(recC),KB.cwe.map(recW),KB.cve.map(recV),KB.d3fend.techniques.map(recD));
  }
  return ids.map(id=>{const o=IDX.byId[id];if(!o)return null;
    if(o.type==='technique'||o.type==='subtechnique'){const t=REV.techById[id]||REV.subById[id];return t?recT(t):{id,name:o.name,type:o.type};}
    if(o.type==='pattern')return recC(REV.capecById[id]);
    if(o.type==='weakness')return recW(REV.cweById[id]);
    if(o.type==='vulnerability')return recV(REV_cve(id));
    if(o.type==='countermeasure')return recD(REV.d3ById[id]);
    return {id,name:o.name,type:o.type,framework:o.fw};}).filter(Boolean);
}
const recT=t=>({id:t.id,name:t.name,framework:'ATT&CK',type:'technique',tactics:t.tactics.map(tacticName),platforms:t.platforms,description:t.summary,detection:t.detection,mitigations:t.mitigations,capec:REV.attack2capec[t.id]||t.capec||[],cwe:REV.attack2cwe[t.id]||t.cwe||[],d3fend:REV.attack2d3[t.id]||[],killchain:t.killchain||[]});
const recC=c=>({id:c.id,name:c.name,framework:'CAPEC',type:'attack-pattern',abstraction:c.abstraction,description:c.summary,cwe:c.cwe,attack:c.attack});
const recW=w=>({id:w.id,name:w.name,framework:'CWE',type:'weakness',description:w.summary,consequences:w.consequences,capec:w.capec,attack:w.attack});
const recV=v=>({id:v.id,name:v.id,framework:'CVE',type:'vulnerability',description:v.desc,severity:v.severity,cvss:v.cvss,products:v.products,cwe:v.cwe});
const recD=d=>({id:d.id,name:d.name,framework:'D3FEND',type:'countermeasure',description:d.definition,tactic:d.tactic,counters:d.counters,artifacts:d.artifacts});

function doExport(fmt){const recs=curRecs();const meta=exMeta();
  if(fmt==='json'){download('ttp-export.json',JSON.stringify({meta,records:recs},null,2),'application/json');}
  else if(fmt==='csv'){const cols=['id','name','framework','type','description'];let rows=[cols];recs.forEach(r=>rows.push(cols.map(c=>Array.isArray(r[c])?r[c].join('; '):(r[c]||''))));
    download('ttp-export.csv',rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');}
  else if(fmt==='md'){let md=`# ${meta.title}\n\n> ${meta.classification} · ${meta.author} · ${meta.generated.slice(0,10)}\n\n_${meta.note}_\n\n`;
    recs.forEach(r=>{md+=`## ${r.id} — ${r.name}\n\n- **Framework:** ${r.framework}\n- **Type:** ${r.type}\n`;if(r.tactics)md+=`- **Tactics:** ${r.tactics.join(', ')}\n`;if(r.description)md+=`\n${r.description}\n`;
      if(r.capec&&r.capec.length)md+=`\n- CAPEC: ${r.capec.join(', ')}`;if(r.cwe&&r.cwe.length)md+=`\n- CWE: ${r.cwe.join(', ')}`;if(r.d3fend&&r.d3fend.length)md+=`\n- D3FEND: ${r.d3fend.join(', ')}`;md+=`\n\n---\n\n`;});
    download('ttp-export.md',md,'text/markdown');}
  else if(fmt==='html'){let h=`<!doctype html><meta charset=utf8><title>${esc(meta.title)}</title><style>body{font-family:system-ui;max-width:900px;margin:30px auto;padding:0 20px;color:#111}h1{border-bottom:3px solid #35d0d8}.rec{border:1px solid #ddd;border-radius:8px;padding:14px;margin:12px 0}.mono{font-family:monospace;color:#0a7}.cls{background:#222;color:#fff;padding:4px 10px;border-radius:5px;font-size:12px;display:inline-block}</style>
     <h1>${esc(meta.title)}</h1><p><span class="cls">${esc(meta.classification)}</span> · ${esc(meta.author)} · ${meta.generated.slice(0,10)}</p><p><em>${esc(meta.note)}</em></p>`;
    recs.forEach(r=>{h+=`<div class="rec"><h3><span class="mono">${esc(r.id)}</span> — ${esc(r.name)}</h3><p><b>${esc(r.framework)}</b> · ${esc(r.type)}${r.tactics?' · '+esc(r.tactics.join(', ')):''}</p><p>${esc(r.description||'')}</p>
      ${r.capec&&r.capec.length?`<p>CAPEC: ${r.capec.join(', ')}</p>`:''}${r.cwe&&r.cwe.length?`<p>CWE: ${r.cwe.join(', ')}</p>`:''}${r.d3fend&&r.d3fend.length?`<p>D3FEND: ${r.d3fend.join(', ')}</p>`:''}</div>`;});
    download('ttp-report.html',h,'text/html');}
  else if(fmt==='stix'){download('ttp-stix.json',JSON.stringify(toSTIX(recs,meta),null,2),'application/json');}
  toast(fmt.toUpperCase()+' exported ('+recs.length+' records)');
}
function stixId(prefix){return prefix+'--'+'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);});}
function toSTIX(recs,meta){const objs=[{type:'identity',spec_version:'2.1',id:stixId('identity'),created:meta.generated,modified:meta.generated,name:meta.author,identity_class:'organization'}];
  const idmap={};
  recs.forEach(r=>{let o=null;
    if(r.framework==='ATT&CK'){o={type:'attack-pattern',spec_version:'2.1',id:stixId('attack-pattern'),created:meta.generated,modified:meta.generated,name:r.name,description:r.description,
      external_references:[{source_name:'mitre-attack',external_id:r.id}],kill_chain_phases:(r.tactics||[]).map(t=>({kill_chain_name:'mitre-attack',phase_name:t.toLowerCase().replace(/ /g,'-')}))};}
    else if(r.framework==='CAPEC'){o={type:'attack-pattern',spec_version:'2.1',id:stixId('attack-pattern'),created:meta.generated,modified:meta.generated,name:r.name,description:r.description,external_references:[{source_name:'capec',external_id:r.id}]};}
    else if(r.framework==='CWE'){o={type:'vulnerability',spec_version:'2.1',id:stixId('vulnerability'),created:meta.generated,modified:meta.generated,name:r.id+' '+r.name,description:r.description,external_references:[{source_name:'cwe',external_id:r.id}]};}
    else if(r.framework==='CVE'){o={type:'vulnerability',spec_version:'2.1',id:stixId('vulnerability'),created:meta.generated,modified:meta.generated,name:r.id,description:r.description,external_references:[{source_name:'cve',external_id:r.id}]};}
    else if(r.framework==='D3FEND'){o={type:'course-of-action',spec_version:'2.1',id:stixId('course-of-action'),created:meta.generated,modified:meta.generated,name:r.name,description:r.description,external_references:[{source_name:'d3fend',external_id:r.id}]};}
    if(o){idmap[r.id]=o.id;objs.push(o);}});
  // relationships
  recs.forEach(r=>{const src=idmap[r.id];if(!src)return;
    (r.d3fend||[]).forEach(d=>{if(idmap[d])objs.push({type:'relationship',spec_version:'2.1',id:stixId('relationship'),created:meta.generated,modified:meta.generated,relationship_type:'mitigates',source_ref:idmap[d],target_ref:src});});
    (r.capec||[]).forEach(c=>{if(idmap[c])objs.push({type:'relationship',spec_version:'2.1',id:stixId('relationship'),created:meta.generated,modified:meta.generated,relationship_type:'related-to',source_ref:src,target_ref:idmap[c]});});});
  return{type:'bundle',id:stixId('bundle'),objects:objs};
}

function lessonDone(cid,li){const p=store('courses')||{};p[cid]=p[cid]||{done:[]};if(!p[cid].done.includes(li))p[cid].done.push(li);store('courses',p);renderCourse(cid);}
VIEWS.paths=function(arg){

  $('#main').innerHTML=`<h1 class="view-title">Learning Paths</h1><p class="view-sub">Structured courses that chain the knowledge base into guided lessons with progress tracking.</p>

/* -------- INTEGRITY & COVERAGE DASHBOARD -------- */
VIEWS.validate=function(){
  // integrity checks
  const broken=[],orphans=[],dupes=[];
  const techIds=new Set(KB.attack.techniques.map(t=>t.id));
  KB.capec.forEach(c=>(c.attack||[]).forEach(a=>{if(!techIds.has(a)&&!REV.subById[a])broken.push(`CAPEC ${c.id} → missing ATT&CK ${a}`);}));
  KB.d3fend.techniques.forEach(d=>(d.counters||[]).forEach(a=>{if(!techIds.has(a)&&!REV.subById[a])broken.push(`D3FEND ${d.id} → missing ATT&CK ${a}`);}));
  KB.cwe.forEach(w=>(w.capec||[]).forEach(c=>{if(!REV.capecById[c])broken.push(`CWE ${w.id} → missing CAPEC ${c}`);}));
  KB.cve.forEach(v=>(v.cwe||[]).forEach(w=>{if(!REV.cweById[w])broken.push(`CVE ${v.id} → missing CWE ${w}`);}));
  KB.attack.techniques.forEach(t=>{const rc=(REV.attack2capec[t.id]||t.capec||[]).length+(REV.attack2cwe[t.id]||[]).length+(REV.attack2d3[t.id]||[]).length;if(rc===0)orphans.push(t.id+' — '+t.name);});
  const seen={};KB.attack.techniques.forEach(t=>{if(seen[t.id])dupes.push(t.id);seen[t.id]=1;});
  // coverage
  const tot=KB.attack.techniques.length;
  const wDet=KB.attack.techniques.filter(t=>KB.detection.techniques[t.id]).length;
  const wMit=KB.attack.techniques.filter(t=>(t.mitigations||[]).length).length;
  const wD3=KB.attack.techniques.filter(t=>(REV.attack2d3[t.id]||[]).length).length;
  const wCap=KB.attack.techniques.filter(t=>(REV.attack2capec[t.id]||t.capec||[]).length).length;
  const pct=n=>Math.round(n/tot*100);
  const covRow=(label,n,cls)=>`<div class="cov-row"><span>${label}</span><div class="cov-bar"><i class="${cls}" style="width:${pct(n)}%"></i></div><span class="mono">${pct(n)}%</span></div>`;
  // confidence tally
  let off=0,cur=0;KB.attack.techniques.forEach(t=>{off+=(REV.attack2capec[t.id]||[]).length+(REV.attack2d3[t.id]||[]).length;cur+=((t.capec||[]).filter(x=>!(REV.attack2capec[t.id]||[]).includes(x)).length)+(REV.attack2cwe[t.id]||[]).length;});
  const gaps=KB.attack.techniques.filter(t=>!KB.detection.techniques[t.id]);
  $('#main').innerHTML=`<h1 class="view-title">Integrity & Coverage</h1><p class="view-sub">Relationship validation and defensive-coverage analysis across the embedded knowledge base.</p>
   <div class="stat-grid" style="margin-bottom:16px">
     <div class="stat ${broken.length?'off':'def'}"><div class="n">${broken.length}</div><div class="l">Broken References</div></div>
     <div class="stat b"><div class="n">${orphans.length}</div><div class="l">Techniques w/o Links</div></div>
     <div class="stat ${dupes.length?'off':'def'}"><div class="n">${dupes.length}</div><div class="l">Duplicate IDs</div></div>
     <div class="stat"><div class="n">${off}</div><div class="l">Official Mappings</div></div>
     <div class="stat"><div class="n">${cur}</div><div class="l">Curated Mappings</div></div>
   </div>
   <div class="panel"><div class="sectitle" style="margin-top:0">Defensive Coverage (of ${tot} Enterprise techniques)</div>
     ${covRow('Detection profile',wDet,'b')}
     ${covRow('ATT&CK mitigation',wMit,'g')}
     ${covRow('D3FEND countermeasure',wD3,'g')}
     ${covRow('CAPEC pattern',wCap,'a')}
     <p class="faint" style="font-size:11px;margin-top:8px">Coverage reflects the curated educational dataset, not full ATT&CK. Detection "profiles" are curated guidance, not validated detections — validate in your environment and track status in the Navigator Matrix.</p>
   </div>
   <div class="panel" style="margin-top:14px"><div class="sectitle" style="margin-top:0">Relationship Validation</div>
     <div class="checkitem ${broken.length?'integrity-warn':'integrity-ok'}">${broken.length?'⚠':'✔'} <span><b>Broken references:</b> ${broken.length?'':'none — every cross-framework link resolves to an existing record.'}</span></div>
     ${broken.length?`<ul class="clean">${broken.slice(0,30).map(b=>`<li class="integrity-warn">${esc(b)}</li>`).join('')}</ul>`:''}
     <div class="checkitem ${dupes.length?'integrity-warn':'integrity-ok'}">${dupes.length?'⚠':'✔'} <span><b>Duplicate identifiers:</b> ${dupes.length?esc(dupes.join(', ')):'none.'}</span></div>
   </div>
   <div class="panel" style="margin-top:14px"><div class="sectitle" style="margin-top:0">Detection Gaps <span class="pill-count">${gaps.length}</span></div>
     <p class="muted">Techniques without a curated detection profile — candidates for detection-engineering work:</p>
     ${gaps.map(t=>`<span class="rel" onclick="go('attack','${t.id}')">${esc(t.id)} ${esc(t.name).slice(0,22)}</span>`).join('')}
   </div>
   <div class="panel" style="margin-top:14px"><div class="sectitle" style="margin-top:0">Techniques Without Any Cross-Framework Link <span class="pill-count">${orphans.length}</span></div>
     ${orphans.length?orphans.map(o=>`<div class="faint" style="font-size:12px">• ${esc(o)}</div>`).join(''):'<p class="integrity-ok">None — every technique connects to at least one other framework.</p>'}
   </div>`;
};

let cmdkItems=[],cmdkSel=0;
function openCmdk(){const nav=NAV.filter(n=>n.id).map(n=>({kind:'nav',id:n.id,label:'Go: '+n.label,ic:n.ic}));
  const root=document.createElement('div');root.className='cmdk-bg';root.id='cmdkBg';
  root.innerHTML=`<div class="cmdk"><input id="cmdkIn" placeholder="Jump to a view or search any ID / keyword…" autocomplete="off"><div class="cmdk-list" id="cmdkList"></div>
    <div class="cmdk-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div></div>`;
  root.onclick=e=>{if(e.target===root)closeCmdk();};document.getElementById('modalRoot').appendChild(root);
  const inp=document.getElementById('cmdkIn');
  const upd=()=>{const q=inp.value.trim();let items;
    if(!q){items=nav;}else{const res=runSearch(q).slice(0,8).map(o=>({kind:'id',id:o.id,label:o.name,fw:o.fw}));
      const navm=nav.filter(n=>n.label.toLowerCase().includes(q.toLowerCase()));items=[...navm,...res];}
    cmdkItems=items;cmdkSel=0;paintCmdk();};
  inp.addEventListener('input',upd);
  inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();cmdkSel=Math.min(cmdkItems.length-1,cmdkSel+1);paintCmdk();}
    else if(e.key==='ArrowUp'){e.preventDefault();cmdkSel=Math.max(0,cmdkSel-1);paintCmdk();}
    else if(e.key==='Enter'){e.preventDefault();runCmdk(cmdkSel);}
    else if(e.key==='Escape'){closeCmdk();}});
  upd();inp.focus();
}
function paintCmdk(){const l=document.getElementById('cmdkList');if(!l)return;
  l.innerHTML=cmdkItems.map((it,i)=>`<div class="cmdk-item ${i===cmdkSel?'on':''}" onclick="runCmdk(${i})">
    ${it.kind==='nav'?`<span class="ic">${it.ic}</span>`:`<span class="tag ${it.fw}">${it.fw.toUpperCase()}</span>`}
    ${it.kind==='id'?`<span class="mono" style="color:var(--cyan)">${esc(it.id)}</span>`:''}<span>${esc(it.label)}</span></div>`).join('')||'<div class="cmdk-item faint">No matches</div>';
}
function runCmdk(i){const it=cmdkItems[i];if(!it)return;closeCmdk();if(it.kind==='nav')go(it.id);else{addRecentView(it.id);openId(it.id);}}
function closeCmdk(){const b=document.getElementById('cmdkBg');if(b)b.remove();}

/* ============================ CONNECTIVITY + DATASET UPDATE ============================ */
let ONLINE=null; // null=unknown/checking, true, false — only true after a real successful probe
function probeOnline(timeout=6000){
  return new Promise(res=>{
    if(typeof navigator!=='undefined'&&navigator.onLine===false){res(false);return;} // quick negative hint only
    const hosts=(KB.meta.probe_hosts||[]);if(!hosts.length){res(false);return;}
    let done=false,errs=0;const finish=v=>{if(!done){done=true;res(v);}};
    const to=setTimeout(()=>finish(false),timeout);
    hosts.forEach(h=>{try{const img=new Image();
      img.onload=()=>{clearTimeout(to);finish(true);};
      img.onerror=()=>{if(++errs>=hosts.length){clearTimeout(to);finish(false);}};
      img.src=h+(h.indexOf('?')>=0?'&':'?')+'_='+Date.now();
    }catch(e){if(++errs>=hosts.length){clearTimeout(to);finish(false);}}});
  });
}
function paintOnline(){const d=$('#netdot');if(d){d.className='netdot '+(ONLINE===null?'chk':ONLINE?'on':'off');d.title='Connectivity: '+(ONLINE===null?'checking…':ONLINE?'online':'offline');}
  const s=$('#netStatus');if(s)s.innerHTML=ONLINE===null?'<span class="faint">● Checking…</span>':ONLINE?'<span class="integrity-ok">● Online</span> <span class="faint">— verified by live probe</span>':'<span class="integrity-warn">● Offline</span> <span class="faint">— no connectivity to update sources</span>';
  const btns=$$('.needs-online');btns.forEach(b=>{b.disabled=ONLINE!==true;b.style.opacity=ONLINE===true?'1':'.5';});}
async function refreshOnline(){ONLINE=null;paintOnline();ONLINE=await probeOnline();paintOnline();return ONLINE;}
/* Online / Offline mode — controls whether the portal reaches live sources and loads the full catalog */
function getMode(){return store('mode')||'offline';}
function datasetIsLive(){return !!(KB.meta&&KB.meta.live);}
function paintMode(){const b=$('#modeBtn');const m=getMode();if(b){b.textContent=m==='online'?'🌐 Online':'⚿ Offline';b.className='btn sm noprint'+(m==='online'?' primary':'');b.title='Mode: '+m+(m==='online'?' — live sources on; click for offline':' — embedded data only; click to go online');}}
async function setMode(m){store('mode',m);paintMode();
  if(m==='online'){const ok=await refreshOnline();
    if(!ok){toast('No live connection confirmed — staying on embedded data. The full catalog loads automatically once a real connection is available.');return;}
    if(!datasetIsLive()){toast('Online — loading the full official ATT&CK catalog…');go('settings');await fetchOfficial('enterprise');}
    else toast('Online mode — live write-ups & references enabled.');
  }else{ONLINE=null;paintOnline();toast('Offline mode — embedded curated data only; no network calls.');}
}
function toggleMode(){setMode(getMode()==='online'?'offline':'online');}

/* IndexedDB (large dataset override lives here, never localStorage) */
function idbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open('ttpnexus',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
async function idbSet(k,v){try{const db=await idbOpen();return await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error);});}catch(e){return false;}}
async function idbGet(k){try{const db=await idbOpen();return await new Promise(res=>{const t=db.transaction('kv','readonly');const rq=t.objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);});}catch(e){return null;}}
async function idbDel(k){try{const db=await idbOpen();return await new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res(true);t.onerror=()=>res(false);});}catch(e){return false;}}

/* STIX 2.1 → TTP NEXUS schema parser (pure, for official ATT&CK bundles) */
function parseAttackStix(bundle){
  const objs=(bundle&&bundle.objects)||[];
  const mitreExt=o=>{const r=(o.external_references||[]).find(x=>x.source_name&&/mitre/i.test(x.source_name)&&x.external_id);return r?r.external_id:null;};
  const alive=o=>!o.revoked&&!o.x_mitre_deprecated;
  const tactics=[];const tacByShort={};
  objs.filter(o=>o.type==='x-mitre-tactic'&&alive(o)).forEach((o,i)=>{const id=mitreExt(o);if(!id)return;tactics.push({id,name:o.name,short:o.x_mitre_shortname,order:i+1});tacByShort[o.x_mitre_shortname]=id;});
  const coa={};objs.filter(o=>o.type==='course-of-action').forEach(o=>{const e=mitreExt(o);coa[o.id]=o.name+(e?' ('+e+')':'');});
  const mitByTech={};objs.filter(o=>o.type==='relationship'&&o.relationship_type==='mitigates').forEach(r=>{(mitByTech[r.target_ref]=mitByTech[r.target_ref]||[]).push(coa[r.source_ref]);});
  const byId={};const parents=[];const subs=[];
  objs.filter(o=>o.type==='attack-pattern'&&alive(o)).forEach(o=>{const id=mitreExt(o);if(!id)return;
    const full=(o.description||'').replace(/\s+/g,' ').trim();
    const refs=(o.external_references||[]).filter(r=>r.url).map(r=>({name:r.source_name||'',id:r.external_id||'',url:r.url,desc:(r.description||'')}));
    const rec={id,name:o.name,summary:full.slice(0,700),desc:full,references:refs,official:true,
      platforms:o.x_mitre_platforms||[],detection:(o.x_mitre_detection||'').replace(/\s+/g,' ').trim(),
      tactics:(o.kill_chain_phases||[]).filter(k=>/mitre/i.test(k.kill_chain_name||'')).map(k=>tacByShort[k.phase_name]).filter(Boolean),
      mitigations:(mitByTech[o.id]||[]).filter(Boolean),
      capec:(o.external_references||[]).filter(r=>r.source_name==='capec'&&r.external_id).map(r=>r.external_id),
      cwe:[],killchain:[],subs:[],_sub:!!o.x_mitre_is_subtechnique};
    byId[id]=rec;(rec._sub?subs:parents).push(rec);});
  subs.forEach(s=>{const p=byId[s.id.split('.')[0]];if(p)p.subs.push({id:s.id,name:s.name,summary:s.summary,desc:s.desc,references:s.references});});
  parents.forEach(p=>delete p._sub);
  const coll=objs.find(o=>o.type==='x-mitre-collection');
  return {tactics,techniques:parents,subCount:subs.length,version:(coll&&coll.x_mitre_version)||null};
}
function detectDataset(obj){
  if(obj&&obj.attack&&Array.isArray(obj.attack.techniques)&&obj.meta) return {kind:'nexus'};
  if(obj&&obj.type==='bundle'&&Array.isArray(obj.objects)){const coll=obj.objects.find(o=>o.type==='x-mitre-collection');const nm=((coll&&coll.name)||'').toLowerCase();
    let dom='attack';if(nm.includes('mobile'))dom='mobile';else if(nm.includes('ics'))dom='ics';return {kind:'stix',domain:dom};}
  return null;
}
async function importDataset(obj,label){
  const d=detectDataset(obj);if(!d){setUpdMsg('<span class="integrity-warn">Unrecognised file — expected an official ATT&CK STIX bundle or a TTP NEXUS dataset export.</span>');return false;}
  if(d.kind==='nexus'){['attack','ics','mobile','d3fend','capec','cwe','cve','killchain','ptes','wstg','owasp_top10','nist_csf','nist_800115','learning','courses','detection','scenario_templates'].forEach(k=>{if(obj[k]!==undefined)KB[k]=obj[k];});
    if(obj.meta){Object.keys(obj.meta).forEach(mk=>{if(mk!=='counts')KB.meta[mk]=obj.meta[mk];});}
    KB.meta.updated=new Date().toISOString().slice(0,10);KB.meta.origin=label||'imported dataset';}
  else{const parsed=parseAttackStix(obj);if(!parsed.techniques.length){setUpdMsg('<span class="integrity-warn">No live techniques found in bundle.</span>');return false;}
    const dk=d.domain;KB[dk]={tactics:parsed.tactics,techniques:parsed.techniques};
    KB.meta.updated=new Date().toISOString().slice(0,10);KB.meta['origin_'+dk]=label||'official STIX';KB.meta.live=true;
    const vlabel=(parsed.version?'v'+parsed.version:'current')+' · full official catalog (fetched)';
    if(dk==='attack')KB.meta.attack_version='ATT&CK '+vlabel;else if(dk==='mobile')KB.meta.mobile_version='ATT&CK Mobile '+vlabel;else if(dk==='ics')KB.meta.ics_version='ATT&CK ICS '+vlabel;}
  rebuildAll();
  const ok=await idbSet('kb_override',JSON.parse(JSON.stringify(KB)));
  if(!ok)setUpdMsg('<span class="integrity-warn">Imported into this session, but could not persist (IndexedDB unavailable). It will reset on reload.</span>');
  return true;
}
async function fetchOfficial(domain){
  const url=(KB.meta.sources||{})[domain];if(!url){toast('No source URL for '+domain);return;}
  let host;try{host=new URL(url).host;}catch(e){host=url;}
  setUpdMsg('<span class="faint">Contacting '+esc(host)+' …</span>');
  try{const resp=await fetch(url,{cache:'no-store'});if(!resp.ok)throw new Error('HTTP '+resp.status+' '+resp.statusText);
    setUpdMsg('<span class="faint">Downloading & parsing '+esc(domain)+' dataset (this file is large)…</span>');
    const json=await resp.json();const ok=await importDataset(json,'official STIX · fetched '+new Date().toISOString().slice(0,10));
    if(ok){const key=domain==='enterprise'?'attack':domain;setUpdMsg('<span class="integrity-ok">✔ Imported official '+esc(domain)+' — '+KB[key].techniques.length+' techniques now loaded.</span>');toast('Dataset updated: '+domain);VIEWS.settings();}
  }catch(e){setUpdMsg('<span class="integrity-warn">Could not fetch automatically: '+esc(e.message)+'.</span> <span class="faint">This is usually CORS, a network block, or being offline. Download the file from the official link and use “Import dataset file” below — that always works, including air-gapped.</span>');}
}
function setUpdMsg(h){const m=$('#updMsg');if(m)m.innerHTML=h;}
function importFromFile(inp){const f=inp.files&&inp.files[0];if(!f)return;setUpdMsg('<span class="faint">Reading '+esc(f.name)+' ('+Math.round(f.size/1048576)+' MB)…</span>');
  const r=new FileReader();r.onload=async()=>{try{const json=JSON.parse(r.result);const ok=await importDataset(json,'file: '+f.name);
    if(ok){setUpdMsg('<span class="integrity-ok">✔ Imported from '+esc(f.name)+'.</span>');toast('Dataset imported');VIEWS.settings();}
  }catch(e){setUpdMsg('<span class="integrity-warn">Import failed: '+esc(e.message)+' — is this valid JSON?</span>');}};
  r.onerror=()=>setUpdMsg('<span class="integrity-warn">Could not read file.</span>');r.readAsText(f);}
async function revertBuiltin(){if(!confirm('Discard the imported dataset and restore the built-in curated dataset? The page will reload.'))return;await idbDel('kb_override');location.reload();}

/* ============================ INIT ============================ */
function bootViews(){const hash=location.hash.slice(1);const[v,arg]=hash.split('/');
  if(v&&VIEWS[v])go(v,arg);else go('dashboard');}
function init(){buildIndex();buildRev();renderNav();wireSearch();
  applyTheme(store('theme')||'dark');
  $('#burger').onclick=()=>$('#sidebar').classList.toggle('collapsed');
  $('#themeBtn').onclick=toggleTheme;
  $('#cmdkBtn').onclick=openCmdk;
  $('#modeBtn').onclick=toggleMode;paintMode();
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!document.getElementById('cmdkBg'))openCmdk();}});
  bootViews();
  window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);const[v2,a2]=h.split('/');if(v2&&v2!==CURRENT&&VIEWS[v2])go(v2,a2);});
  // async: apply any previously imported dataset, THEN honour the chosen mode — neither blocks first paint
  idbGet('kb_override').then(ov=>{
    if(ov&&ov.attack&&ov.attack.techniques){try{Object.keys(ov).forEach(k=>{KB[k]=ov[k];});rebuildAll();bootViews();}catch(e){}}
    if(getMode()==='online'){refreshOnline().then(ok=>{if(ok&&!datasetIsLive())fetchOfficial('enterprise');});}
    else{ONLINE=null;paintOnline();}
  }).catch(()=>{if(getMode()==='online')refreshOnline();});
}
init();
</script>
